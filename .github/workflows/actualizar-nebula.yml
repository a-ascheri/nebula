name: Actualizar datos astronómicos Nebula

on:
  schedule:
    # Cada 10 minutos
    - cron: '*/10 * * * *'
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permiso para commitear el JSON actualizado
permissions:
  contents: write

# Una sola corrida por vez
concurrency:
  group: actualizar-nebula
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Ejecutar script de actualización Nebula
        env:
          NEBULA_APP_ID: ${{ secrets.NEBULA_APP_ID }}
          NEBULA_APP_SECRET: ${{ secrets.NEBULA_APP_SECRET }}
        run: node tools/actualizar-nebula.js

      - name: Guardar y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nebula-astro.json
          if git diff --cached --quiet; then
            echo "Sin cambios: nebula-astro.json queda igual."
          else
            git commit -m "chore: actualizar efemérides Nebula [skip ci]"
            git fetch origin main
            if ! git rebase -X ours --empty=drop origin/main; then
              git rebase --abort
              echo "Corrida superada por una más nueva: no se publica nada."
              exit 0
            fi
            git push
          fi
